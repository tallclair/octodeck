name: Release

on:
  push:
    tags:
      - 'v*'

# Grant write permission to the workflow's GITHUB_TOKEN so it can create releases and upload assets
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for git describe & release notes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build WebApp & Extension
        env:
          OCTODECK_VERSION: ${{ github.ref_name }}
        run: npm run build:frontend

      - name: Package Distributions
        env:
          OCTODECK_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist

          # 1. Backend Binary (Linux AMD64)
          ./scripts/build-backend.sh -o "dist/octodeck-${VERSION}-linux-amd64"

          # 2. Extension Bundle (.zip)
          (cd extension_dist && zip -q -r "../dist/octodeck-extension-${VERSION}.zip" .)

          # 3. Standalone Web App Distribution (.zip)
          (cd backend/frontend_dist && zip -q -r "../../dist/octodeck-webapp-${VERSION}.zip" .)

      - name: Assemble Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error file=${NOTES_FILE}::Release notes ${NOTES_FILE} are missing from the tagged commit."
            exit 1
          fi

          # Committed, reviewed notes followed by a fixed assets footer.
          {
            cat "$NOTES_FILE"
            echo ""
            echo "---"
            echo ""
            echo "## Release Assets"
            echo ""
            echo "* \`octodeck-${VERSION}-linux-amd64\`: Linux daemon binary (includes the embedded web app)."
            echo "* \`octodeck-extension-${VERSION}.zip\`: Companion Chrome extension (extract and load via \`chrome://extensions/\`)."
            echo "* \`octodeck-webapp-${VERSION}.zip\`: Standalone static web app assets (optional, for external hosting)."
            echo ""
            echo "See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/README.md) for installation steps and prerequisites, and the [User Guide](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/user_guide.md) for detailed usage instructions."
          } > RELEASE_NOTES.md

      - name: Create Draft Release (Official GitHub CLI)
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "OctoDeck ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
