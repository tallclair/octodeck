edition = "2023";

package octodeck.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "octodeck/v1/query.proto";
import "octodeck/v1/resources.proto";

option go_package = "github.com/tallclair/octodeck/backend/internal/api/v1;octodeckv1";

service OctoDeckService {
  // Main Dashboard Data
  rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // Available filter values with counts (dropdown options, sidebar counts).
  rpc GetFacets(GetFacetsRequest) returns (GetFacetsResponse);

  // Synchronization (Streaming)
  rpc Sync(SyncRequest) returns (stream SyncResponse);

  // Actions
  rpc ViewItem(ViewItemRequest) returns (ViewItemResponse);
  rpc AckItem(AckItemRequest) returns (AckItemResponse);
  rpc StarItem(StarItemRequest) returns (StarItemResponse);
  rpc SetNotes(SetNotesRequest) returns (SetNotesResponse);
  rpc RefetchItem(RefetchItemRequest) returns (RefetchItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);

  // Synchronization Status & Traces
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
  rpc GetSyncTraces(GetSyncTracesRequest) returns (GetSyncTracesResponse);

  // Database & Storage Observability
  rpc GetDatabaseStats(GetDatabaseStatsRequest) returns (GetDatabaseStatsResponse);

  // Configuration
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // Desktop notifications and toolbar badge (server streaming). The daemon decides what to
  // notify during sync; clients only display what they are sent.
  rpc WatchNotifications(WatchNotificationsRequest) returns (stream WatchNotificationsResponse);
}

message GetItemsRequest {
  // Was the removed Filter message.
  reserved 1;
  reserved filter;

  // Items to return. Unset means the empty query (implicit triage:inbox). An invalid query
  // returns InvalidArgument with an ExprError detail.
  Expr query = 2;
  // Unset means SORT_KEY_UPDATED, SORT_ORDER_DESC.
  Sort sort = 3;
}

message GetItemsResponse {
  repeated Item items = 1;
}

message GetItemRequest {
  string item_id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message GetFacetsRequest {
  // Validated and scoped exactly as GetItemsRequest.query.
  Expr query = 1;
  // Fields to facet. FIELD_UNSPECIFIED, FIELD_IN and FIELD_TEXT are InvalidArgument.
  repeated Field fields = 2;
}

message GetFacetsResponse {
  // One facet per requested field, in request order. For each field, every known value is
  // listed with the count of items matching the query with that field's own top-level
  // predicates removed (for FIELD_TRIAGE: with triage:all instead of the implicit inbox).
  repeated Facet facets = 1;
}

message SyncRequest {}

message SyncResponse {
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_FETCHING = 1;
    STAGE_PROCESSING = 2;
    STAGE_COMPLETE = 3;
  }
  Stage stage = 1;
  string message = 2;
  int32 items_processed = 3;
}

message ViewItemRequest {
  string item_id = 1;
}

message ViewItemResponse {
  Item item = 1;
}

message AckItemRequest {
  string item_id = 1;
  bool acked = 2;
}

message AckItemResponse {
  Item item = 1;
}

message StarItemRequest {
  string item_id = 1;
  bool starred = 2;
}

message StarItemResponse {
  Item item = 1;
}

message SetNotesRequest {
  string item_id = 1;
  string notes = 2;
}

message SetNotesResponse {
  Item item = 1;
}

message RefetchItemRequest {
  string item_id = 1;
}

message RefetchItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string item_id = 1;
}

message DeleteItemResponse {}

message UpdateSubscriptionRequest {
  string item_id = 1;
  SubscriptionState state = 2;
}

message UpdateSubscriptionResponse {
  Item item = 1;
}

message Config {
  repeated string watched_repos = 1;
  repeated string pinned_repos = 2;
  repeated string excluded_repos = 3;
  int32 polling_interval_min = 4;
  repeated string known_bots = 5;
  bool auto_ack_own_activity = 6;
  int32 port = 7;
  string db_path = 8;
  repeated string included_labels = 9;
  repeated string excluded_labels = 10;
  repeated string tracked_queries = 11;
  int32 discovery_interval_min = 12;
  repeated string auto_subscribe_queries = 13;
  NotificationSettings notification_settings = 14;
}

// How the extension toolbar badge counts items.
enum BadgeCountMode {
  // Treated as BADGE_COUNT_MODE_INBOX.
  BADGE_COUNT_MODE_UNSPECIFIED = 0;
  // Items that are not acknowledged.
  BADGE_COUNT_MODE_INBOX = 1;
  // Items that are not acknowledged, idle, or noise.
  BADGE_COUNT_MODE_UNREAD = 2;
  // No count badge.
  BADGE_COUNT_MODE_DISABLED = 3;
}

// Desktop notification and badge preferences. Unset fields take the daemon defaults, so GetConfig
// always returns every field populated.
message NotificationSettings {
  // Master switch. When off nothing notifies, mentions included.
  bool enabled = 1;
  // Wildcard patterns ('*' and '?'). If an include list is non-empty the item must match at least
  // one include; it must match no exclude. Labels match if any label matches.
  repeated string repo_includes = 2;
  repeated string repo_excludes = 3;
  repeated string label_includes = 4;
  repeated string label_excludes = 5;
  repeated string author_includes = 6;
  repeated string author_excludes = 7;
  // Only notify for items authored by or assigned to the authenticated user.
  bool only_assigned_or_authored = 8;
  // Notify when a never-seen item appears.
  bool notify_on_new_items = 9;
  // Notify on new comments, reviews, state changes, and commits by others.
  bool notify_on_new_activity = 10;
  // Never notify for noise (bots, slash commands, bot reviews and state events).
  bool ignore_bots = 11;
  // New explicit @mentions of the user notify even if the item fails the filters above.
  bool always_include_mentions = 12;
  BadgeCountMode badge_count_mode = 13;
}

message TrackedQueryStats {
  string query = 1;
  double daily_average_7d = 2;
  double daily_average_30d = 3;
}

message GetConfigRequest {}

message GetConfigResponse {
  Config config = 1;
  string current_user_login = 2;
  repeated TrackedQueryStats query_stats = 3;
}

message UpdateConfigRequest {
  Config config = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool force_save = 3;
}

message TrackedQueryWarning {
  string query = 1;
  int32 match_count_48h = 2;
  double daily_average = 3;
  string message = 4;
}

message UpdateConfigResponse {
  Config config = 1;
  repeated TrackedQueryWarning query_warnings = 2;
  bool saved = 3;
  repeated TrackedQueryStats query_stats = 4;
}

message GetSyncStatusRequest {}

message SyncStatus {
  google.protobuf.Timestamp last_successful_sync_at = 1;
  google.protobuf.Timestamp last_sync_attempt_at = 2;
  google.protobuf.Timestamp last_update_received_at = 3;
  bool last_sync_failed = 4;
  string last_error_message = 5;
  int32 failed_attempts_count = 6;
  bool is_syncing = 7;
  double notification_rate_24h = 8;
  double notification_rate_7d = 9;
  double notification_rate_30d = 10;
  int64 last_sync_duration_ms = 11;
  bool has_notifications_scope = 12;
}

message GetSyncStatusResponse {
  SyncStatus status = 1;
}

message GetSyncTracesRequest {
  int32 limit = 1;
  string trace_type = 2;
  bool include_payload = 3;
}

message GetSyncTracesResponse {
  repeated SyncTrace traces = 1;
}

message DatabaseStats {
  int64 total_items = 1;
  int64 open_items = 2;
  int64 closed_items = 3;
  int64 pr_items = 4;
  int64 issue_items = 5;
  int64 unacked_items = 6;
  int64 acked_items = 7;
  int64 total_repos = 8;
  int64 total_traces = 9;
  int64 db_size_bytes = 10;
  string db_path = 11;
}

message GetDatabaseStatsRequest {}

message GetDatabaseStatsResponse {
  DatabaseStats stats = 1;
}

// Why an item produced a notification, in descending priority.
enum NotificationCategory {
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;
  // A new explicit @mention of the authenticated user.
  NOTIFICATION_CATEGORY_MENTION = 1;
  // A never-seen item authored by someone else.
  NOTIFICATION_CATEGORY_NEW_ITEM = 2;
  // New significant comments, reviews, review comments, or state events by others.
  NOTIFICATION_CATEGORY_ACTIVITY = 3;
  // New commits by others.
  NOTIFICATION_CATEGORY_CODE = 4;
  // New noise (bot comments, slash commands, bot reviews, bot state events).
  NOTIFICATION_CATEGORY_NOISE = 5;
}

message Notification {
  // Stable identifier; clients use it to avoid showing the same notification twice.
  string id = 1;
  string item_id = 2;
  // e.g. "owner/repo #123".
  string title = 3;
  string message = 4;
  // Dashboard URL that opens the item.
  string url = 5;
  NotificationCategory category = 6;
  // Daemon clock.
  google.protobuf.Timestamp created_at = 7;
}

// Sent instead of individual notifications when a reconnecting client missed more than a few.
message NotificationSummary {
  // Number of distinct items.
  int32 count = 1;
  string title = 2;
  string message = 3;
  string url = 4;
}

message BadgeUpdate {
  int32 count = 1;
  BadgeCountMode mode = 2;
  // Text to display on the badge ("" for none).
  string text = 3;
  // Tooltip for the extension action.
  string tooltip = 4;
}

message Heartbeat {}

message WatchNotificationsRequest {
  // sent_at of the last message the client received. When set, notifications emitted after it
  // that are still in the daemon's in-memory buffer are replayed (or summarised).
  google.protobuf.Timestamp last_received_at = 1;
}

message WatchNotificationsResponse {
  // Daemon clock. Clients pass the latest value back as last_received_at when reconnecting.
  google.protobuf.Timestamp sent_at = 1;
  oneof event {
    Notification notification = 2;
    NotificationSummary summary = 3;
    BadgeUpdate badge = 4;
    Heartbeat heartbeat = 5;
  }
}
